# Read the Docs build for SorbFlow (MkDocs + Material + mkdocstrings).
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # build_docs.py stages only git-indexed files; make sure history is complete.
      - git fetch --unshallow || true
    post_install:
      - python scripts/build_docs.py --prepare-only
mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
