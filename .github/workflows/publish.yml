name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check that the tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          /tmp/wheel-env/bin/sorbflow batch examples/batch_ldf.json --output /tmp/smoke-batch
      - uses: actions/upload-artifact@v7
        with:
          name: sorbflow-dist
          path: dist/
          if-no-files-found: error
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sorbflow/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: sorbflow-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
