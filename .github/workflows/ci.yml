name: scientific-prototype
on: [push, pull_request]
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,optimize,parquet]'
      - run: python -m pytest --cov=pyfast --cov-report=term-missing --cov-fail-under=90
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m build
