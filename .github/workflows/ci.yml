name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,optimize,parquet]'
      - run: python scripts/project_checks.py --output runs/ci-quality
      - run: python -m build
      - name: Install the built wheel in a clean environment
        shell: bash
        run: |
          python -m venv wheel-env
          if [ -x wheel-env/bin/python ]; then PY=wheel-env/bin/python; else PY=wheel-env/Scripts/python.exe; fi
          "$PY" -m pip install dist/*.whl
          "$PY" -m sorbflow --help
          "$PY" -c "import sorbflow; print(sorbflow.__version__ if hasattr(sorbflow, '__version__') else 'ok')"
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: sorbflow-dist
          path: dist/
          if-no-files-found: error
