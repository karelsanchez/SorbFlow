name: documentation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
env:
  NO_MKDOCS_2_WARNING: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install pinned documentation toolchain and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          python -m pip install .
      - name: Check internal documentation links
        run: python scripts/check_doc_links.py
      - name: Build site (strict, warnings are errors)
        run: python scripts/build_docs.py --output .work/site
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: sorbflow-documentation
          path: .work/site/
          if-no-files-found: error
