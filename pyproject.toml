[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sorbflow"
version = "0.4.0"
description = "Configurable aqueous adsorption modelling: batch and fixed-bed LDF/HSDM simulation, calibration, uncertainty and design"
readme = "PYPI_README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Karel Aldrin Sanchez Hernandez" },
  { name = "David Esteban Rodriguez Saiz" },
  { name = "Dayana Ximena Cabrera Obando" },
  { name = "Gabriela Johana Romo Cadena" },
]
maintainers = [{ name = "Karel Aldrin Sanchez Hernandez" }]
keywords = ["adsorption", "water treatment", "fixed-bed", "breakthrough curve", "LDF", "HSDM", "isotherm", "simulation"]
dependencies = ["pint>=0.24,<0.26", "numpy>=1.26,<3", "scipy>=1.12,<2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Natural Language :: Spanish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/karelsanchez/SorbFlow"
Documentation = "https://sorbflow.readthedocs.io"
Repository = "https://github.com/karelsanchez/SorbFlow"
Issues = "https://github.com/karelsanchez/SorbFlow/issues"
Changelog = "https://github.com/karelsanchez/SorbFlow/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1,<2", "scipy-stubs>=1.14,<2", "ezdxf>=1.3,<2"]
optimize = ["pymoo>=0.6.1,<0.7"]
parquet = ["pyarrow>=17,<27"]

[project.scripts]
sorbflow = "sorbflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sorbflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/data_catalog"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Follow the active interpreter so installed dependency stubs use matching syntax.
# Python 3.11 remains covered by requires-python, Ruff and the CI matrix.
strict = true
files = ["src/sorbflow"]

[[tool.mypy.overrides]]
module = ["pymoo.*", "pyarrow.*"]
ignore_missing_imports = true
